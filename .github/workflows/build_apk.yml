name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Upgrade Android Embedding & Build APK
        run: |
          cd app_tam_ly_khkt
          # Tự động tạo lại cấu trúc Android chuẩn v2 để không bị lỗi thiếu Manifest
          flutter create . --platforms=android --org com.mindshield.app
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app_tam_ly_khkt/build/app/outputs/flutter-apk/app-release.apk
