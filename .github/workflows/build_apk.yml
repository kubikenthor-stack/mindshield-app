name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./app_tam_ly_khkt

      - name: Fix minSdkVersion to 24
        run: |
          cd app_tam_ly_khkt
          # Tự động cập nhật minSdkVersion từ 21 lên 24 trong file build.gradle để tương thích plugin mới
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle || true

      - name: Build APK Release
        run: flutter build apk --release
        working-directory: ./app_tam_ly_khkt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app_tam_ly_khkt/build/app/outputs/flutter-apk/app-release.apk
